version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: projecthub-db
    environment:
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: projecthub123
      POSTGRES_DB: projecthub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projecthub-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://projecthub:projecthub123@postgres:5432/projecthub_db
      JWT_SECRET: your-secret-key-here
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projecthub-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
